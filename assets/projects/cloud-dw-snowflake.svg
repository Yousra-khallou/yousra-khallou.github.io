<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="p5_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2c" />
      <stop offset="50%" stop-color="#213252" />
      <stop offset="100%" stop-color="#3b5b8c" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#p5_bg)"/>

  <!-- Snowflake / Airflow DAG graphic -->
  <g transform="translate(110, 65)">
    <!-- Node 1: Extract -->
    <rect x="0" y="30" width="70" height="60" rx="12" fill="rgba(255,255,255,0.1)" stroke="#82a9cc"/>
    <text x="35" y="65" fill="#ffffff" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Extract</text>

    <line x1="72" y1="60" x2="120" y2="60" stroke="#82a9cc" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Node 2: Airflow DAG -->
    <rect x="122" y="10" width="120" height="100" rx="14" fill="rgba(130, 169, 204, 0.2)" stroke="#82a9cc" stroke-width="1.8"/>
    <text x="182" y="45" fill="#ffffff" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Airflow DAG</text>
    <text x="182" y="68" fill="#b9d6f0" font-family="'DM Sans', sans-serif" font-size="9" text-anchor="middle">Scheduled &amp; Sensor</text>
    <text x="182" y="85" fill="#75b897" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">✓ SUCCESS</text>

    <line x1="244" y1="60" x2="290" y2="60" stroke="#82a9cc" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Node 3: Snowflake -->
    <rect x="292" y="25" width="90" height="70" rx="14" fill="rgba(255,255,255,0.1)" stroke="#82a9cc"/>
    <text x="337" y="58" fill="#ffffff" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Snowflake</text>
    <text x="337" y="76" fill="#b9d6f0" font-family="'DM Sans', sans-serif" font-size="9" text-anchor="middle">Analytics DW</text>
  </g>

  <text x="300" y="245" fill="#ffffff" opacity="0.9" font-family="'DM Sans', sans-serif" font-size="15" font-weight="600" text-anchor="middle">Cloud Data Warehouse &amp; Airflow Orchestration</text>
  <text x="300" y="268" fill="#c3dbee" opacity="0.75" font-family="'DM Sans', sans-serif" font-size="11" text-anchor="middle">Airflow 2.x · Snowflake · Data Modeling (Star Schema) · PowerBI</text>
</svg>
