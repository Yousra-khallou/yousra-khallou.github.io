    <text x="35" y="42" fill="#ffffff" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Kafka</text>
  </g>
  <g transform="translate(265, 140)">
    <rect width="70" height="70" rx="18" fill="rgba(255,255,255,0.18)" stroke="#d98ba8" stroke-width="2"/>
    <text x="35" y="42" fill="#ffffff" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Spark</text>
  </g>
  <g transform="translate(430, 140)">
    <rect width="70" height="70" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <text x="35" y="42" fill="#ffffff" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Delta Lake</text>
  </g>

  <!-- Pulse dots -->
  <circle cx="185" cy="155" r="4" fill="#d98ba8" />
  <circle cx="385" cy="180" r="4" fill="#b7a5db" />
  
  <text x="300" y="270" fill="#ffffff" opacity="0.9" font-family="'DM Sans', sans-serif" font-size="15" font-weight="600" text-anchor="middle">Real-Time Streaming Architecture</text>
  <text x="300" y="292" fill="#d0c6d9" opacity="0.7" font-family="'DM Sans', sans-serif" font-size="11" text-anchor="middle">100k+ events/sec throughput · Low-latency processing</text>
