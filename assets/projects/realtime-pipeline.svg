      <stop offset="0%" stop-color="#1b172b" />
      <stop offset="50%" stop-color="#3d264a" />
      <stop offset="100%" stop-color="#6e3c66" />
    </linearGradient>
    <linearGradient id="p1_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d98ba8" />
      <stop offset="100%" stop-color="#b7a5db" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#p1_bg)"/>
  <circle cx="520" cy="60" r="140" fill="#b7a5db" opacity="0.08"/>
  <circle cx="80" cy="300" r="110" fill="#d98ba8" opacity="0.08"/>
  
  <!-- Flow lines -->
  <path d="M 80 175 C 180 110, 240 240, 340 175 C 420 120, 480 200, 520 175" fill="none" stroke="url(#p1_accent)" stroke-width="3" stroke-dasharray="6,6" opacity="0.75"/>
  
  <!-- Pipeline Nodes -->
  <g transform="translate(100, 140)">
