<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="p4_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192823" />
      <stop offset="50%" stop-color="#2a453b" />
      <stop offset="100%" stop-color="#4d7866" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#p4_bg)"/>

  <!-- Waveform / Anomaly Chart -->
  <g transform="translate(100, 60)">
    <rect width="400" height="130" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)"/>
    <!-- Normal Wave -->
    <path d="M 30 65 Q 60 25, 90 65 T 150 65 T 210 65 T 270 20 T 300 110 T 330 65 T 370 65" fill="none" stroke="#75b897" stroke-width="3"/>
    <!-- Anomaly Point -->
    <circle cx="285" cy="50" r="16" fill="rgba(217, 139, 168, 0.25)" stroke="#d98ba8" stroke-width="2"/>
    <circle cx="285" cy="50" r="5" fill="#d98ba8"/>
    <text x="285" y="24" fill="#ffb4cf" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Anomaly Detected (99.4%)</text>
  </g>

  <text x="300" y="245" fill="#ffffff" opacity="0.9" font-family="'DM Sans', sans-serif" font-size="15" font-weight="600" text-anchor="middle">Industrial Predictive Maintenance & Anomaly Detection</text>
  <text x="300" y="268" fill="#c3e6d6" opacity="0.75" font-family="'DM Sans', sans-serif" font-size="11" text-anchor="middle">Time-Series (LSTM / Isolation Forest) · Sensor Ingestion · Prometheus Alerts</text>
</svg>
