<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="p2_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192738" />
      <stop offset="50%" stop-color="#2a455a" />
      <stop offset="100%" stop-color="#557c8d" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#p2_bg)"/>
  <circle cx="100" cy="80" r="100" fill="#a5cadb" opacity="0.08"/>
  <circle cx="500" cy="270" r="130" fill="#8bc2cb" opacity="0.08"/>

  <!-- Medallion layers -->
  <g transform="translate(130, 95)">
    <rect x="0" y="0" width="100" height="90" rx="14" fill="rgba(189, 140, 105, 0.25)" stroke="#d99f77" stroke-width="1.5"/>
    <text x="50" y="45" fill="#ffffff" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Bronze</text>
    <text x="50" y="65" fill="#f0d5c2" font-family="'DM Sans', sans-serif" font-size="9" text-anchor="middle">Raw Ingestion</text>

    <!-- Arrow -->
    <path d="M 112 45 L 128 45" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    
    <rect x="140" y="0" width="100" height="90" rx="14" fill="rgba(195, 205, 215, 0.25)" stroke="#cdd8e3" stroke-width="1.5"/>
    <text x="190" y="45" fill="#ffffff" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Silver</text>
    <text x="190" y="65" fill="#e0e8f0" font-family="'DM Sans', sans-serif" font-size="9" text-anchor="middle">Cleaned / Validated</text>

    <!-- Arrow -->
    <path d="M 252 45 L 268 45" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <rect x="280" y="0" width="100" height="90" rx="14" fill="rgba(230, 195, 95, 0.28)" stroke="#f7d463" stroke-width="2"/>
    <text x="330" y="45" fill="#ffffff" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Gold</text>
    <text x="330" y="65" fill="#fff1b8" font-family="'DM Sans', sans-serif" font-size="9" text-anchor="middle">Business Aggregates</text>
  </g>

  <text x="300" y="245" fill="#ffffff" opacity="0.9" font-family="'DM Sans', sans-serif" font-size="15" font-weight="600" text-anchor="middle">Medallion Lakehouse Architecture</text>
  <text x="300" y="268" fill="#c3dfe6" opacity="0.75" font-family="'DM Sans', sans-serif" font-size="11" text-anchor="middle">dbt Core · AWS S3 · Trino / DuckDB · Great Expectations</text>
</svg>
